<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
@page{size:126px 130px;margin:0}
html{font-family:ParitySans;line-height:1.5}
*{margin:0;box-sizing:border-box}
html,body{background:#fff}
body{padding:12px}
.control{width:70px;height:46px;border:2px solid #222;background:#f1f5f9;padding:5px;margin-bottom:10px}
.outer{border-collapse:collapse;width:70px;height:46px}
.outer>tbody>tr>td{border:2px solid #222;background:#f1f5f9;padding:5px;vertical-align:top}
.inner{border-collapse:collapse;width:42px;height:28px}
.inner td{border:4px solid #d61f69;background:#00a651}
</style>
</head>
<body>
<div class="control"><table class="inner"><tr><td></td></tr></table></div>
<table class="outer"><tr><td><table class="inner"><tr><td></td></tr></table></td></tr></table>
</body>
</html>
