<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
@page{size:126px 126px;margin:0}
html{font-family:ParitySans;line-height:1.5}
*{margin:0;box-sizing:border-box}
html,body{background:#fff}
body{padding:12px}
.control{width:70px;height:44px;border:2px solid #222;background:#f1f5f9;padding:6px;margin-bottom:10px}
table{border-collapse:collapse;width:70px;height:44px}
td{border:2px solid #222;background:#f1f5f9;padding:6px;vertical-align:top}
.mark::before{content:"G";display:block;width:42px;height:24px;background:#00a651;color:#fff;font-weight:700;font-size:16px;line-height:24px;font-family:ParitySans;text-align:center}
</style>
</head>
<body>
<div class="control"><div class="mark"></div></div>
<table><tr><td><div class="mark"></div></td></tr></table>
</body>
</html>
