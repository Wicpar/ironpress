<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
@page{size:120px 122px;margin:0}
html{font-family:ParitySans;line-height:1.5}
*{margin:0;box-sizing:border-box}
html,body{background:#fff}
body{padding:12px}
.control{width:64px;height:42px;border:2px solid #222;background:#f1f5f9;padding:5px;margin-bottom:10px}
table{border-collapse:collapse;width:64px;height:42px}
td{border:2px solid #222;background:#f1f5f9;padding:5px;vertical-align:top}
svg{display:block;width:28px;height:28px}
</style>
</head>
<body>
<div class="control"><svg viewBox="0 0 28 28"><rect width="28" height="28" fill="#1769ff"/><circle cx="14" cy="14" r="8" fill="#ffd21f"/></svg></div>
<table><tr><td><svg viewBox="0 0 28 28"><rect width="28" height="28" fill="#1769ff"/><circle cx="14" cy="14" r="8" fill="#ffd21f"/></svg></td></tr></table>
</body>
</html>
