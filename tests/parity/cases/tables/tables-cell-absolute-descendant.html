<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
@page{size:126px 126px;margin:0}
html{font-family:ParitySans;line-height:1.5}
*{margin:0;box-sizing:border-box}
html,body{background:#fff}
body{padding:12px}
.control{width:70px;height:44px;border:2px solid #222;background:#f1f5f9;padding:6px;margin-bottom:10px}
table{border-collapse:collapse;width:70px;height:44px}
td{border:2px solid #222;background:#f1f5f9;padding:6px;vertical-align:top}
.pos{position:relative;width:44px;height:28px;background:#e5e7eb}
.abs{position:absolute;left:18px;top:5px;width:20px;height:20px;background:#d61f69}
</style>
</head>
<body>
<div class="control"><div class="pos"><div class="abs"></div></div></div>
<table><tr><td><div class="pos"><div class="abs"></div></div></td></tr></table>
</body>
</html>
