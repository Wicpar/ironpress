<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
@page{size:132px 130px;margin:0}
html{font-family:ParitySans;line-height:1.5}
*{margin:0;box-sizing:border-box}
html,body{background:#fff}
body{padding:12px}
.control{width:72px;height:46px;border:2px solid #222;background:#f1f5f9;padding:6px;margin-bottom:10px}
.flex{display:flex;width:72px;height:46px;border:2px solid #222;background:#f1f5f9;padding:5px;align-items:flex-start}
.item{width:36px;height:32px;border:2px solid #777;background:#fff}
svg{display:block;width:28px;height:28px}
</style>
</head>
<body>
<div class="control"><svg viewBox="0 0 28 28"><rect width="28" height="28" fill="#1769ff"/><circle cx="14" cy="14" r="8" fill="#ffd21f"/></svg></div>
<div class="flex"><div class="item"><svg viewBox="0 0 28 28"><rect width="28" height="28" fill="#1769ff"/><circle cx="14" cy="14" r="8" fill="#ffd21f"/></svg></div></div>
</body>
</html>
