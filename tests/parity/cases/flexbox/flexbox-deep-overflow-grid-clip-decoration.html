<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>flexbox deep overflow grid clip decoration</title>
<style>
  @page { size: 360px 210px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  body { padding: 18px; }
  .outer {
    display: flex;
    gap: 12px;
    width: 324px;
    height: 174px;
    padding: 12px;
    border: 2px solid #111827;
    background: #f8fafc;
  }
  .clip {
    flex: 0 0 172px;
    overflow: hidden;
    border: 2px solid #7c2d12;
    background: #ffedd5;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 72px);
    grid-template-rows: 56px 56px;
    gap: 8px;
    width: 236px;
    height: 128px;
    margin: 14px 0 0 14px;
    padding: 4px;
    border: 2px solid #1e3a8a;
    background: #dbeafe;
  }
  .tile {
    border: 2px solid #334155;
    background: #86efac;
  }
  .hot {
    border-color: #be123c;
    background: #fb7185;
  }
  .side {
    flex: 1 1 auto;
    border: 2px solid #581c87;
    background: #e9d5ff;
  }
</style>
</head>
<body>
  <div class="outer">
    <div class="clip">
      <div class="grid">
        <div class="tile"></div>
        <div class="tile hot"></div>
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile hot"></div>
      </div>
    </div>
    <div class="side"></div>
  </div>
</body>
</html>
