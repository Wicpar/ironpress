<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>deep block overflow clip scroll chain</title>
<style>
  @page { size: 360px 225px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  body { padding: 18px; }
  .outer {
    width: 300px;
    height: 170px;
    padding: 14px;
    overflow: hidden;
    background: #f3edff;
    border: 5px solid #4a2a7c;
  }
  .level1 {
    width: 270px;
    height: 138px;
    margin-left: 22px;
    overflow: hidden;
    background: #d8f0ff;
    border: 4px solid #0f5c87;
  }
  .level2 {
    width: 230px;
    height: 106px;
    margin-top: 12px;
    overflow: scroll;
    background: #fff4cc;
    border: 4px solid #9a6500;
  }
  .canvas {
    width: 360px;
    height: 180px;
  }
  .stripe { height: 45px; }
  .a { background: #d94f4f; }
  .b { background: #2d6cdf; }
  .c { background: #2e9e5b; }
  .d { background: #e08a1e; }
</style>
</head>
<body>
  <div class="outer">
    <div class="level1">
      <div class="level2">
        <div class="canvas">
          <div class="stripe a"></div>
          <div class="stripe b"></div>
          <div class="stripe c"></div>
          <div class="stripe d"></div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
