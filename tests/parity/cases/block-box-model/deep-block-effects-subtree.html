<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>deep block effects subtree</title>
<style>
  @page { size: 390px 250px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  body { padding: 28px; }
  .stage {
    width: 330px;
    height: 190px;
    padding: 18px;
    background: #e8edf3;
    border: 4px solid #243044;
  }
  .group {
    width: 230px;
    height: 118px;
    padding: 12px;
    opacity: 0.72;
    transform: translate(42px, 20px) scale(0.92);
    background: #ffc966;
    border: 5px solid #8a4a00;
    box-shadow: 18px 16px 0 rgba(29, 49, 82, 0.45);
  }
  .level1 {
    height: 100%;
    padding: 10px;
    background: #8bd7ff;
    border: 4px solid #075d87;
  }
  .level2 {
    height: 100%;
    padding: 8px;
    background: #c8efb6;
    border: 4px solid #386f28;
  }
  .leaf {
    height: 100%;
    background: #c8466b;
    border: 4px solid #6b1730;
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="group">
      <div class="level1">
        <div class="level2">
          <div class="leaf"></div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
