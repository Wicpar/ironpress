<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>deep block absolute containing chain</title>
<style>
  @page { size: 385px 240px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  body { padding: 20px; }
  .stage {
    position: relative;
    width: 330px;
    height: 190px;
    padding: 22px;
    background: #edf2f8;
    border: 5px solid #26364f;
  }
  .level1 {
    width: 230px;
    height: 126px;
    padding: 14px;
    background: #ffe5ab;
    border: 4px solid #965d00;
  }
  .level2 {
    width: 170px;
    height: 86px;
    padding: 12px;
    background: #c9ecff;
    border: 4px solid #11627f;
  }
  .level3 {
    width: 96px;
    height: 42px;
    background: #bfe8b1;
    border: 4px solid #3b762f;
  }
  .badge {
    position: absolute;
    left: 220px;
    top: 116px;
    width: 78px;
    height: 44px;
    background: #c8466b;
    border: 5px solid #6b1730;
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="level1">
      <div class="level2">
        <div class="level3">
          <div class="badge"></div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
