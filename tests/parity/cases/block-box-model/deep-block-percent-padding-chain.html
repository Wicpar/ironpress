<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>deep block percent padding chain</title>
<style>
  @page { size: 420px 300px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  body { padding: 18px; }
  .outer {
    width: 360px;
    padding: 20px 24px 18px 28px;
    background: #d8ecff;
    border: 4px solid #163b6d;
  }
  .level1 {
    width: 75%;
    margin-left: auto;
    padding: 10% 8%;
    background: #ffe0a3;
    border: 3px solid #a75d00;
  }
  .level2 {
    width: 82%;
    padding: 12px 16px;
    margin-left: 18px;
    background: #d7f4d8;
    border: 4px solid #2b7c3f;
  }
  .level3 {
    width: 50%;
    height: 58px;
    margin-left: 25%;
    background: #c8466b;
    border: 5px solid #6a1730;
  }
</style>
</head>
<body>
  <div class="outer">
    <div class="level1">
      <div class="level2">
        <div class="level3"></div>
      </div>
    </div>
  </div>
</body>
</html>
