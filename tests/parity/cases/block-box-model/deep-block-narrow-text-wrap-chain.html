<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>deep block narrow text wrap chain</title>
<style>
  @page { size: 340px 330px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  body { padding: 18px; }
  .stage {
    width: 260px;
    padding: 12px;
    background: #eef1f6;
    border: 4px solid #344055;
  }
  .level1 {
    width: 72%;
    padding: 8px;
    background: #f8d99c;
    border: 3px solid #a15f00;
  }
  .level2 {
    width: 68%;
    padding: 6px;
    background: #bde8ff;
    border: 3px solid #166a94;
  }
  .copy {
    width: 100%;
    padding: 5px;
    background: #ffffff;
    border: 3px solid #a12f4f;
    color: #1f2b3d;
    font-size: 16px;
    line-height: 1.25;
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="level1">
      <div class="level2">
        <p class="copy">Deep nested columns wrap words into a tall narrow stack.</p>
      </div>
    </div>
  </div>
</body>
</html>
