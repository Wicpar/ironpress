<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>deep block percent height chain</title>
<style>
  @page { size: 360px 260px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  body { padding: 18px; }
  .outer {
    width: 300px;
    height: 210px;
    padding: 18px;
    background: #e6ebf2;
    border: 4px solid #25364f;
  }
  .level1 {
    height: 75%;
    padding: 12px;
    background: #ffd9b7;
    border: 3px solid #b3531a;
  }
  .level2 {
    height: 60%;
    padding: 10px;
    background: #c8edff;
    border: 3px solid #0d6d96;
  }
  .level3 {
    height: 50%;
    padding: 7px;
    background: #d3f1c4;
    border: 3px solid #457323;
  }
  .leaf {
    height: 100%;
    background: #8246c8;
    border: 4px solid #3a1a63;
  }
</style>
</head>
<body>
  <div class="outer">
    <div class="level1">
      <div class="level2">
        <div class="level3">
          <div class="leaf"></div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
