<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>grid deep grid grid place self</title>
<style>
  @page { size: 390px 232px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  body { padding: 18px; }
  .outer {
    display: grid;
    grid-template-columns: 116px 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 10px;
    width: 354px;
    height: 196px;
    padding: 10px;
    border: 2px solid #111827;
    background: #f8fafc;
  }
  .plain {
    border: 2px solid #7f1d1d;
    background: #fecaca;
  }
  .nested {
    display: grid;
    grid-template-columns: 54px 74px;
    grid-template-rows: 48px 68px;
    place-content: center end;
    gap: 8px;
    grid-column: 2;
    grid-row: 1 / 3;
    padding: 8px;
    border: 2px solid #0f766e;
    background: #ccfbf1;
  }
  .cell {
    border: 2px solid #334155;
    background: #bfdbfe;
  }
  .target {
    place-self: end center;
    width: 44px;
    height: 34px;
    border: 2px solid #86198f;
    background: #f0abfc;
  }
</style>
</head>
<body>
  <div class="outer">
    <div class="plain"></div>
    <div class="plain"></div>
    <div class="nested">
      <div class="cell"></div>
      <div class="target"></div>
      <div class="cell"></div>
      <div class="cell"></div>
    </div>
  </div>
</body>
</html>
