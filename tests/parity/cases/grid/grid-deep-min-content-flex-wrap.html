<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>grid deep min content flex wrap</title>
<style>
  @page { size: 420px 224px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  body { padding: 18px; }
  .outer {
    display: grid;
    grid-template-columns: min-content 1fr;
    gap: 12px;
    width: 384px;
    height: 188px;
    padding: 10px;
    border: 2px solid #111827;
    background: #f8fafc;
  }
  .left {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 8px;
    border: 2px solid #9a3412;
    background: #ffedd5;
  }
  .chip {
    width: min-content;
    padding: 4px;
    border: 2px solid #075985;
    background: #bae6fd;
    font-size: 13px;
    line-height: 1.1;
  }
  .right {
    display: flex;
    align-items: stretch;
    min-width: 0;
    padding: 8px;
    border: 2px solid #166534;
    background: #dcfce7;
  }
  .copy {
    flex: 1 1 auto;
    min-width: 0;
    padding: 6px;
    border: 2px solid #581c87;
    background: #ffffff;
    font-size: 14px;
    line-height: 1.2;
    overflow-wrap: anywhere;
  }
</style>
</head>
<body>
  <div class="outer">
    <div class="left">
      <div class="chip">MINIMUM</div>
      <div class="chip">TRACK</div>
    </div>
    <div class="right">
      <div class="copy">the flexible track keeps enough space for nested wrapped prose</div>
    </div>
  </div>
</body>
</html>
