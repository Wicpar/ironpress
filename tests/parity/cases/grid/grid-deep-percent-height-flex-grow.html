<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>grid deep percent height flex grow</title>
<style>
  @page { size: 420px 242px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  body { padding: 18px; }
  .outer {
    display: grid;
    grid-template-columns: 1fr 116px;
    grid-template-rows: 48px 1fr;
    gap: 12px;
    width: 384px;
    height: 206px;
    padding: 10px;
    border: 2px solid #111827;
    background: #f8fafc;
  }
  .top {
    grid-column: 1 / 3;
    border: 2px solid #166534;
    background: #bbf7d0;
  }
  .main {
    display: grid;
    grid-template-rows: 35% 1fr;
    height: 100%;
    gap: 8px;
    padding: 8px;
    border: 2px solid #1d4ed8;
    background: #dbeafe;
  }
  .band {
    border: 2px solid #b45309;
    background: #fde68a;
  }
  .deep {
    display: flex;
    flex-direction: column;
    height: 100%;
    padding: 6px;
    border: 2px solid #7e22ce;
    background: #f3e8ff;
  }
  .fill {
    flex: 1 1 auto;
    border: 2px solid #0f766e;
    background: #99f6e4;
  }
  .foot {
    flex: 0 0 24px;
    margin-top: 6px;
    border: 2px solid #9f1239;
    background: #fda4af;
  }
  .side {
    border: 2px solid #7c2d12;
    background: #fed7aa;
  }
</style>
</head>
<body>
  <div class="outer">
    <div class="top"></div>
    <div class="main">
      <div class="band"></div>
      <div class="deep">
        <div class="fill"></div>
        <div class="foot"></div>
      </div>
    </div>
    <div class="side"></div>
  </div>
</body>
</html>
